        /* 科技背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 100, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 150, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(100, 200, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 100%;
            margin: 0;
            background: transparent;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(180deg, rgba(10, 30, 60, 0.95) 0%, rgba(5, 15, 35, 0.9) 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
            border-bottom: 2px solid rgba(0, 150, 255, 0.3);
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 100, 255, 0.2);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 150, 255, 0.8) 20%, 
                rgba(100, 200, 255, 1) 50%, 
                rgba(0, 150, 255, 0.8) 80%, 
                transparent 100%);
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 600;
            background: linear-gradient(90deg, #00d4ff, #0099ff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 150, 255, 0.5);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
            color: #88aacc;
        }

        .treemap-container {
            padding: 30px;
            position: relative;
            background: rgba(10, 25, 50, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 150, 255, 0.2);
            margin: 20px;
            border-radius: 12px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        #treemap-svg {
            width: 100%;
            height: auto;
            display: block;
            max-height: calc(100vh - 250px);  /* 限制最大高度 */
        }

        /* 行业标签样式 */
        .industry-label {
            font-size: 15px;
            font-weight: bold;
            fill: #00d4ff;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        /* 矩形样式 */
        .indicator-rect {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .indicator-rect:hover {
            filter: brightness(1.2) drop-shadow(0 4px 12px rgba(0, 150, 255, 0.6));
            stroke-width: 2px;
            stroke: #00d4ff;
        }

        /* 指标名称样式 */
        .indicator-name {
            font-size: 11px;
            fill: #fff;
            pointer-events: none;
            font-weight: 500;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        /* 占比文字样式 */
        .indicator-share {
            font-size: 10px;
            fill: #fff;
            pointer-events: none;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
            opacity: 0.9;
        }

        /* Tooltip样式 */
        .tooltip {
            position: absolute;
            background: rgba(10, 25, 50, 0.95);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 1000;
            max-width: 350px;
            box-shadow: 
                0 8px 32px rgba(0, 100, 255, 0.3),
                0 0 20px rgba(0, 150, 255, 0.2);
            border: 1px solid rgba(0, 150, 255, 0.4);
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0, 150, 255, 0.3);
            padding-bottom: 5px;
            color: #00d4ff;
        }

        .tooltip-row {
            margin: 4px 0;
        }

        .tooltip-label {
            color: #88aacc;
            display: inline-block;
            width: 120px;
        }

        .tooltip-value {
            color: #fff;
            font-weight: 500;
        }

        .tooltip-remark {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 150, 255, 0.2);
            font-style: italic;
            color: #ffcc00;
        }

        /* v5.9.2: 火花图数据点悬浮tooltip */
        .sparkline-tooltip {
            position: fixed;
            background: rgba(10, 25, 50, 0.92);
            color: #e0f0ff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            border: 1px solid rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            z-index: 9999;
            white-space: nowrap;
        }

        .sparkline-tooltip.visible {
            opacity: 1;
        }

        .health-status {
            display: inline-block;
            padding: 4px 12px;

        .status-red {

            background: rgba(220, 180, 60, 0.2);

        /* 折线图样式（v5.4科技蓝统一配色） */
        .sparkline-path {
            fill: none;
            stroke: #00d4ff;
            stroke-width: 2.5;
            stroke-linecap: round;

        /* 图例（v4.6.1优化：与科技风UI融为一体） */
        .legend {
            display: flex;

            gap: 24px;
            padding: 16px 30px;
            background: rgba(10, 25, 50, 0.6);

        .legend-group {
            display: flex;
            align-items: center;
            gap: 16px;

        .legend-divider {
            width: 1px;
            height: 20px;
            background: rgba(0, 150, 255, 0.3);
            margin: 0 8px;

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #88aacc;

        .legend-item span {
            white-space: nowrap;

        .legend-color {

        .editable-value {

            transition: all 0.3s ease;
            min-width: 36px;
            text-align: center;
        }

        .editable-value:hover {
            background: rgba(0, 150, 255, 0.15);
            border-bottom-color: #00d4ff;
            text-shadow: 0 0 6px rgba(0, 212, 255, 0.4);
        }

        .editable-input {
            display: inline-block;
            width: 52px;
            padding: 1px 4px;
            border: 1px solid #00d4ff;
            border-radius: 3px;
            background: rgba(0, 30, 60, 0.95);

            font-size: 13px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            text-align: center;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 6px rgba(0, 150, 255, 0.3);

        /* 详情弹窗样式 */
        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
        }

        .detail-modal.active {
            display: block;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 15, 35, 0.85);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, rgba(10, 30, 60, 0.98) 0%, rgba(5, 20, 45, 0.98) 100%);
            border-radius: 12px;
            box-shadow: 
                0 12px 48px rgba(0, 100, 255, 0.4),
                0 0 30px rgba(0, 150, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 150, 255, 0.4);
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(0, 150, 255, 0.4);
            background: rgba(0, 100, 200, 0.3);
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #00d4ff;
        }

        .modal-close:hover {
            background: rgba(0, 150, 255, 0.5);
            border-color: #00d4ff;
            transform: rotate(90deg);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);

        .modal-header {

        .modal-title {

            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .modal-status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid;
            opacity: 1;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .modal-info-item {
            background: rgba(0, 100, 200, 0.15);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 150, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .modal-info-label {
            font-size: 12px;
            color: #88aacc;
            margin-bottom: 5px;
        }

        .modal-info-value {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .modal-remark {
            background: rgba(255, 204, 0, 0.15);
            border-left: 4px solid #ffcc00;
            padding: 12px;
            margin-bottom: 25px;
            border-radius: 4px;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }

        .modal-remark-label {
            font-size: 12px;
            color: #ffcc00;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .modal-remark-text {
            font-size: 14px;
            color: #ffdd44;
        }

        .modal-chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
        }

        #modal-sparkline-container {
            width: 100%;
            height: 250px;
            background: rgba(0, 50, 100, 0.2);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(0, 150, 255, 0.2);
        }

        /* v5.0: 整体综合弹窗样式 */
        .summary-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: none;
        }

        .summary-modal.active {
            display: block;
        }

        .summary-modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, rgba(10, 30, 60, 0.98) 0%, rgba(5, 20, 45, 0.98) 100%);
            border-radius: 12px;
            box-shadow: 
                0 12px 48px rgba(0, 100, 255, 0.4),
                0 0 30px rgba(0, 150, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 150, 255, 0.4);
            width: 95%;
            max-width: 1200px;
            max-height: 85vh;

        .summary-modal-title {

        }

        .summary-chart-container {
            width: 100%;
            min-height: 400px;
            background: rgba(0, 50, 100, 0.2);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(0, 150, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* v4.9: 数据集选择器样式 */
        .header-info-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        .dataset-dropdown {
            background: linear-gradient(135deg, rgba(0, 100, 200, 0.6) 0%, rgba(0, 80, 180, 0.7) 100%);
            border: 1px solid rgba(0, 150, 255, 0.4);
            border-radius: 6px;
            padding: 6px 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 100, 200, 0.3);
            min-width: 120px;
        }

        .dataset-dropdown:hover {
            background: linear-gradient(135deg, rgba(0, 120, 220, 0.7) 0%, rgba(0, 100, 200, 0.8) 100%);
            border-color: rgba(0, 180, 255, 0.6);
            box-shadow: 0 3px 12px rgba(0, 120, 220, 0.4);
            transform: translateY(-1px);
        }

        .dataset-dropdown:focus {
            border-color: rgba(0, 200, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(0, 150, 255, 0.2), 0 3px 12px rgba(0, 120, 220, 0.4);
        }

        /* v5.9: 重算按钮 */
        .recalc-button {
            background: linear-gradient(135deg, rgba(0, 160, 100, 0.6) 0%, rgba(0, 130, 80, 0.7) 100%);
            border: 1px solid rgba(0, 200, 120, 0.4);
            border-radius: 6px;
            padding: 6px 14px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 160, 100, 0.3);
            white-space: nowrap;
        }

        .recalc-button:hover {
            background: linear-gradient(135deg, rgba(0, 180, 120, 0.7) 0%, rgba(0, 150, 100, 0.8) 100%);
            border-color: rgba(0, 220, 140, 0.6);
            box-shadow: 0 3px 12px rgba(0, 180, 120, 0.4);
            transform: translateY(-1px);
        }

        .recalc-button:active {
            transform: translateY(0);
        }

        .recalc-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            animation: recalc-pulse 1.5s ease-in-out infinite;
        }

        @keyframes recalc-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* v5.9.10: TAB标签导航 */
        .tab-nav {
            display: flex;

            gap: 4px;
            padding: 4px;

            border: 1px solid rgba(0, 150, 255, 0.25);
            border-radius: 8px;
            flex-shrink: 0;

        .tab-btn {
            padding: 5px 16px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: rgba(180, 210, 240, 0.7);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: rgba(0, 150, 255, 0.15);
            color: #00d4ff;
            border-color: rgba(0, 150, 255, 0.3);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 120, 220, 0.7) 0%, rgba(0, 160, 255, 0.6) 100%);

            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 150, 255, 0.35);

        /* v5.9.10: TAB面板 */

            display: none;

        .tab-panel.active {
            display: block;

        /* v6.0: 气泡图KPI宏观卡片 */
        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 20px 20px 0 20px;
        }

        .kpi-card {
            background: linear-gradient(135deg, rgba(10, 30, 55, 0.85) 0%, rgba(15, 40, 70, 0.7) 100%);
            border: 1px solid rgba(0, 150, 255, 0.25);
            border-radius: 10px;
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .kpi-card:hover {
            border-color: rgba(0, 200, 255, 0.5);
            box-shadow: 0 6px 24px rgba(0, 100, 200, 0.3);
            transform: translateY(-2px);
        }

        .kpi-card .kpi-title {
            font-size: 12px;
            color: rgba(150, 200, 230, 0.7);
            margin-bottom: 8px;
            letter-spacing: 1px;

        // v5.9: 绘制内嵌月度走势图（仅月度数据，完整坐标轴 + 柔和折线）
        function drawSparkline(g, indicator, x, y, w, h) {
            // v5.9: 仅使用月度数据，无月度数据时显示"暂无数据"
            const monthlyValues = indicator.monthlyValues || [];
            const monthlyDates = indicator.monthlyDates || [];
            
            if (monthlyValues.length === 0) {
                g.append('text')
                    .attr('x', x + w / 2)
                    .attr('y', y + h / 2)
                    .attr('class', 'sparkline-placeholder')
                    .text('暂无数据');
                return;
            }
            
            // 收集有效数据点
            const validPoints = [];
            monthlyValues.forEach((value, index) => {
                if (value !== null && value !== undefined) {
                    validPoints.push({ x: index, y: value, date: monthlyDates[index] || (index + 1) });
                }
            });
            
            if (validPoints.length === 0) {
                g.append('text')
                    .attr('x', x + w / 2)
                    .attr('y', y + h / 2)
                    .attr('class', 'sparkline-placeholder')
                    .text('暂无数据');
                return;
            }
            
            // v5.9: 坐标轴内边距（左侧Y轴18px，底部X轴12px，右侧8px）
            const axisLeftPad = 18;
            const axisBottomPad = 12;
            const axisRightPad = 8;
            const plotX = x + axisLeftPad;
            const plotY = y + 3;
            const plotW = w - axisLeftPad - axisRightPad;
            const plotH = h - axisBottomPad - 3;
            
            // 计算Y轴范围（2% padding）
            const values = validPoints.map(p => p.y);
            const minVal = Math.min(...values);
            const maxVal = Math.max(...values);
            const range = maxVal - minVal || 1;
            const padding = range * 0.02;
            const yMin = minVal - padding;
            const yMax = maxVal + padding;
            
            // 创建比例尺
            const maxIndex = monthlyValues.length - 1;
            const xScale = d3.scaleLinear()
                .domain([0, maxIndex])
                .range([plotX, plotX + plotW]);
            
            const yScale = d3.scaleLinear()
                .domain([yMin, yMax])
                .range([plotY + plotH, plotY]);
            
            // v5.9: Y轴（左侧，显示%符号和刻度值）
            const yAxis = d3.axisLeft(yScale)
                .ticks(3)
                .tickSize(3)
                .tickFormat(d => d);
            
            const yAxisG = g.append('g')
                .attr('transform', `translate(${plotX - 3}, 0)`)
                .attr('class', 'sparkline-axis')
                .call(yAxis);
            
            // Y轴domain线（淡色基线，提供视觉锚点）
            yAxisG.select('.domain')
                .attr('stroke', 'rgba(136,170,204,0.5)');
            yAxisG.selectAll('.tick line')
                .attr('stroke', 'rgba(136,170,204,0.5)')
                .attr('x1', -2);
            yAxisG.selectAll('.tick text')
                .attr('font-size', '7px')
                .attr('fill', 'rgba(180,200,230,0.9)')
                .attr('dx', '-1');
            
            // Y轴顶部"%"标签
            g.append('text')
                .attr('x', plotX)
                .attr('y', plotY + 1)
                .attr('text-anchor', 'start')
                .attr('font-size', '8px')
                .attr('font-weight', 'bold')
                .attr('fill', 'rgba(180,200,230,0.9)')
                .text('%');
            
            // v5.9: X轴（底部，显示日期刻度和月份标签）
            const tickValues = [0, 1, 2, 3, 4, 5];
            const tickLabels = ['1', '6', '11', '16', '21', '26'];
            const xAxis = d3.axisBottom(xScale)
                .tickValues(tickValues)
                .tickFormat((d, i) => tickLabels[i])
                .tickSize(3);
            
            const xAxisG = g.append('g')
                .attr('transform', `translate(0, ${plotY + plotH + 2})`)
                .attr('class', 'sparkline-axis')
                .call(xAxis);
            
            // X轴domain线（淡色基线）
            xAxisG.select('.domain')
                .attr('stroke', 'rgba(136,170,204,0.5)');
            xAxisG.selectAll('.tick line')
                .attr('stroke', 'rgba(136,170,204,0.5)');
            xAxisG.selectAll('.tick text')
                .attr('font-size', '7px')
                .attr('fill', 'rgba(180,200,230,0.85)');
            
            // v5.9.2: 移除横轴右侧月份标签（迭代1）
            
            // v5.9: 柔和折线（CatmullRom alpha=0.25，更平滑）
            const lineGenerator = d3.line()
                .x(d => xScale(d.x))
                .y(d => yScale(d.y))
                .curve(d3.curveCatmullRom.alpha(0.25))
                .defined(d => d.y !== null);
            
            // 找出连续的线段
            const segments = [];
            let currentSegment = [];
            
            for (let i = 0; i < monthlyValues.length; i++) {
                if (monthlyValues[i] !== null && monthlyValues[i] !== undefined) {
                    currentSegment.push({ x: i, y: monthlyValues[i], defined: true });
                } else {
                    if (currentSegment.length > 1) {
                        segments.push(currentSegment);
                    }
                    currentSegment = [];
                }
            }
            if (currentSegment.length > 1) {
                segments.push(currentSegment);
            }
            
            // 绘制折线（科技蓝）
            segments.forEach(segment => {
                g.append('path')
                    .datum(segment)
                    .attr('class', 'sparkline-path')
                    .attr('d', lineGenerator);
            });
            
            // v5.9.2: 绘制数据点（双层：可见点 + 透明大圈命中检测）
            validPoints.forEach(point => {
                // 透明命中圈（r=8, 用于捕获鼠标事件）
                g.append('circle')
                    .attr('cx', xScale(point.x))
                    .attr('cy', yScale(point.y))
                    .attr('r', 8)
                    .attr('fill', 'none')
                    .attr('stroke', 'none')
                    .attr('pointer-events', 'all')
                    .on('mouseover', function(event) {
                        event.stopPropagation();
                        const st = document.getElementById('sparkline-tooltip');
                        const sign = point.y >= 0 ? '+' : '';
                        st.textContent = `${point.date}: ${sign}${point.y.toFixed(1)}%`;
                        st.classList.add('visible');
                    })
                    .on('mousemove', function(event) {
                        const st = document.getElementById('sparkline-tooltip');
                        st.style.left = (event.clientX + 12) + 'px';
                        st.style.top = (event.clientY - 30) + 'px';
                    })
                    .on('mouseout', function() {
                        const st = document.getElementById('sparkline-tooltip');
                        st.classList.remove('visible');
                    });

                // 可见小圆点（仅视觉）
                g.append('circle')
                    .attr('cx', xScale(point.x))
                    .attr('cy', yScale(point.y))
                    .attr('r', 2.5)
                    .attr('class', 'sparkline-point')
                    .attr('pointer-events', 'none');
            });
        }

        // 截断文本（v4.5版本）
        // 文本截断函数（v4.7优化：保障最小字符数）
        function truncateText(text, maxWidth, fontSize = 11, minChars = 2) {
            if (!text) return '';
            
            // 计算最大可显示字符数
            const charsPerWidth = 0.6 / fontSize; // 每像素字符数估算
            const maxChars = Math.floor(maxWidth * charsPerWidth);
            
            // 确保至少显示minChars个字符
            const actualMaxChars = Math.max(minChars, maxChars);
            
            // 如果文本长度不超过实际最大字符数，直接返回
            if (text.length <= actualMaxChars) {
                return text;
            }
            
            // 截断并添加省略号
            return text.substring(0, actualMaxChars - 2) + '..';
        }

        // 文字自动换行函数（v4.6新增）
        function wrapText(group, text, x, y, maxWidth, lineHeight, maxLines = 2) {
            if (!text) return;
            
            const words = text.split('');  // 中文字符按字拆分
            let line = '';
            let lines = [];
            
            for (let i = 0; i < words.length; i++) {
                const testLine = line + words[i];
                const metrics = getTextWidth(testLine, 10);  // 10px字体
                
                if (metrics > maxWidth && i > 0) {
                    lines.push(line);
                    line = words[i];
                    
                    if (lines.length >= maxLines - 1) {
                        // 达到最大行数，剩余文字截断
                        const remaining = text.substring(i);
                        const truncated = truncateText(remaining, maxWidth, 10);
                        lines.push(truncated);
                        break;
                    }
                } else {
                    line = testLine;
                }
            }
            
            if (line && lines.length < maxLines) {
                lines.push(line);
            }
            
            // 渲每一行
            lines.forEach((lineText, index) => {
                group.append('text')
                    .attr('x', x)
                    .attr('y', y + index * lineHeight)
                    .attr('class', 'indicator-share')
                    .attr('text-anchor', 'start')
                    .style('font-size', '10px')
                    .text(lineText);
            });
        }

        // 计算文本宽度
        function getTextWidth(text, fontSize) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = `${fontSize}px Microsoft YaHei`;
            return context.measureText(text).width;
        }

        // v5.9: 绘制月度详细走势图（用于弹窗，仅月度数据）
        function drawDetailedSparkline(svg, indicator, width, height) {
            const monthlyValues = indicator.monthlyValues || [];
            const monthlyDates = indicator.monthlyDates || [];
            
            if (monthlyValues.length === 0) {
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#999')
                    .attr('font-size', '14px')
                    .text('暂无月度数据');
                return;
            }
            
            // 构建有效数据点
            const validData = monthlyValues.map((v, i) => ({
                date: monthlyDates[i] || (i + 1),
                index: i,
                value: v
            })).filter(d => d.value !== null && d.value !== undefined);
            
            if (validData.length === 0) {
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#999')
                    .attr('font-size', '14px')
                    .text('暂无月度数据');
                return;
            }
            
            const margin = { top: 20, right: 30, bottom: 50, left: 60 };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;
            
            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);
            
            // 比例尺
            const x = d3.scalePoint()
                .domain(validData.map(d => d.date))
                .range([0, chartWidth])
                .padding(0.5);
            
            const yMin = d3.min(validData, d => d.value);
            const yMax = d3.max(validData, d => d.value);
            const yRange = (yMax - yMin) || 1;
            const y = d3.scaleLinear()
                .domain([yMin - yRange * 0.05, yMax + yRange * 0.05])
                .range([chartHeight, 0]);
            
            // 网格线
            g.append('g')
                .attr('class', 'grid')
                .call(d3.axisLeft(y).ticks(5).tickSize(-chartWidth).tickFormat(''))
                .selectAll('line')
                .attr('stroke', 'rgba(0, 150, 255, 0.2)')
                .attr('stroke-dasharray', '3,3');
            
            g.selectAll('.grid path').remove();
            
            // X轴
            g.append('g')
                .attr('transform', `translate(0,${chartHeight})`)
                .call(d3.axisBottom(x))
                .selectAll('text')
                .attr('font-size', '12px')
                .attr('fill', '#88aacc');
            
            // X轴标签
            g.append('text')
                .attr('x', chartWidth / 2)
                .attr('y', chartHeight + 40)
                .attr('text-anchor', 'middle')
                .attr('font-size', '12px')
                .attr('fill', 'rgba(136,170,204,0.6)')
                .text('时间');
            
            // Y轴
            g.append('g')
                .call(d3.axisLeft(y).ticks(5))
                .selectAll('text')
                .attr('font-size', '12px')
                .attr('fill', '#88aacc');
            
            // Y轴标签
            g.append('text')
                .attr('transform', 'rotate(-90)')
                .attr('y', -45)
                .attr('x', -chartHeight / 2)
                .attr('text-anchor', 'middle')
                .attr('font-size', '12px')
                .attr('fill', 'rgba(136,170,204,0.6)')
                .text('%');
            
            g.selectAll('.domain').attr('stroke', 'rgba(0, 150, 255, 0.3)');
            g.selectAll('.tick line').attr('stroke', 'rgba(0, 150, 255, 0.2)');
            
            // v5.9: 柔和折线（CatmullRom曲线，alpha=0.25）
            const line = d3.line()
                .x(d => x(d.date))
                .y(d => y(d.value))
                .curve(d3.curveCatmullRom.alpha(0.25));
            
            g.append('path')
                .datum(validData)
                .attr('fill', 'none')
                .attr('stroke', '#00d4ff')
                .attr('stroke-width', 3)
                .attr('d', line)
                .attr('filter', 'drop-shadow(0 0 8px rgba(0, 212, 255, 0.6))');
            
            // 数据点
            g.selectAll('.dot')
                .data(validData)
                .enter()
                .append('circle')
                .attr('cx', d => x(d.date))
                .attr('cy', d => y(d.value))
                .attr('r', 6)
                .attr('fill', '#00d4ff')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .attr('filter', 'drop-shadow(0 0 6px rgba(255, 255, 255, 0.5))');
            
            // 数值标签
            g.selectAll('.label')
                .data(validData)
                .enter()
                .append('text')
                .attr('x', d => x(d.date))
                .attr('y', d => y(d.value) - 15)
                .attr('text-anchor', 'middle')
                .attr('font-size', '12px')
                .attr('font-weight', 'bold')
                .attr('fill', '#00d4ff')
                .attr('text-shadow', '0 0 8px rgba(0, 212, 255, 0.6)')
                .text(d => d.value.toFixed(1) + '%');
        }

        // 主渲染函数
        function renderTreemap(data) {
            const svg = d3.select('#treemap-svg');
            svg.selectAll('*').remove();
            
            const industries = data.industries;
            
            // v4.8: 启用最小面积保障 - 为每个指标分配finalDisplayShare
            const minArea = CONFIG.minIndicatorArea;  // 3500px²
            const minWidth = CONFIG.minIndicatorWidth;   // 40px
            const minHeight = CONFIG.minIndicatorHeight; // 60px
            const totalArea = CONFIG.width * CONFIG.height;  // 总面积
            
            // v4.8: 计算形状约束下的最小面积
            const shapeConstrainedArea = minWidth * minHeight; // 40 × 60 = 2400px²
            // 取两者较大值作为实际保底
            const effectiveMinArea = Math.max(minArea, shapeConstrainedArea); // 3500px²
            
            console.log(`v4.8 面积保障: minArea=${minArea}, shapeConstrained=${shapeConstrainedArea}, effective=${effectiveMinArea}`);
            
            // 第一步：计算所有指标的原始面积需求
            let allIndicators = [];
            industries.forEach(ind => {
                ind.indicators.forEach(indicator => {
                    const originalArea = (indicator.gdpShare / 100) * totalArea;
                    allIndicators.push({
                        indicator: indicator,
                        originalArea: originalArea,
                        finalDisplayShare: indicator.gdpShare,  // 默认使用原始占比
                        needsAdjustment: originalArea < effectiveMinArea  // v4.8: 使用effectiveMinArea
                    });
                });
            });
            
            // 第二步：从小指标匀出面积给大指标（保持视觉平衡）
            const indicatorsNeedingBoost = allIndicators.filter(i => i.needsAdjustment);
            const indicatorsWithSurplus = allIndicators.filter(i => !i.needsAdjustment);
            
            if (indicatorsNeedingBoost.length > 0) {
                // 计算需要补充的总面积
                let totalDeficit = 0;
                indicatorsNeedingBoost.forEach(item => {
                    const deficit = minArea - item.originalArea;
                    totalDeficit += deficit;
                });
                
                // 从大指标中匀出面积（限制最多匀出30%）
                let totalAvailable = 0;
                indicatorsWithSurplus.forEach(item => {
                    const maxCanGive = item.originalArea * 0.3;  // 最多匀出30%
                    totalAvailable += maxCanGive;
                });
                
                // 如果可用面积足够，进行分配
                if (totalAvailable >= totalDeficit) {
                    // 按比例从大指标中匀出
                    const ratio = totalDeficit / totalAvailable;
                    indicatorsWithSurplus.forEach(item => {
                        const maxCanGive = item.originalArea * 0.3;
                        const toGive = maxCanGive * ratio;
                        item.finalDisplayShare = ((item.originalArea - toGive) / totalArea) * 100;
                    });
                    
                    // 给小指标补充面积
                    indicatorsNeedingBoost.forEach(item => {
                        item.finalDisplayShare = (effectiveMinArea / totalArea) * 100;  // v4.8: 使用effectiveMinArea
                    });
                } else {
                    // 如果可用面积不足，按比例分配
                    const ratio = totalAvailable / totalDeficit;
                    indicatorsNeedingBoost.forEach(item => {
                        const deficit = minArea - item.originalArea;
                        const boosted = item.originalArea + deficit * ratio;
                        item.finalDisplayShare = (boosted / totalArea) * 100;
                    });
                    
                    // 从大指标中匀出
                    indicatorsWithSurplus.forEach(item => {
                        const maxCanGive = item.originalArea * 0.3;
                        item.finalDisplayShare = ((item.originalArea - maxCanGive) / totalArea) * 100;
                    });
                }
                
                console.log(`v4.8 面积调整: ${indicatorsNeedingBoost.length}个小指标获得保障，从${indicatorsWithSurplus.length}个大指标匀出面积`);
            }
            
            // 将finalDisplayShare写回原始数据
            allIndicators.forEach(item => {
                item.indicator.finalDisplayShare = item.finalDisplayShare;
            });
            
            // 创建层次结构
            const root = d3.hierarchy({
                children: industries.map(ind => ({
                    name: ind.name,
                    value: ind.totalShare,
                    indicators: ind.indicators
                }))
            })
            .sum(d => d.value)
            .sort((a, b) => b.value - a.value);
            
            // 创建树形布局
            const treemap = d3.treemap()
                .size([CONFIG.width, CONFIG.height])
                .paddingOuter(CONFIG.paddingOuter)
                .paddingInner(CONFIG.paddingInner)
                .round(true);
            
            treemap(root);
            
            // 创建分组

                .data(root.leaves())
                .enter()
                .append('g')
                .attr('class', 'industry-group');
            

            
            // 添加行业背景
            industryGroups.append('rect')
                .attr('x', d => d.x0)
                .attr('y', d => d.y0)
                .attr('width', d => d.x1 - d.x0)

            // 添加行业标签（优化：垂直居中，显示完整名称和实际占比）
            industryGroups.append('text')
                .attr('x', d => d.x0 + 5)
                .attr('y', d => d.y0 + CONFIG.labelHeight / 2)  // 垂直居中

                    const element = d3.select(this);
                    
                    // 计算行业原始占比总和（实际占比）

                        return sum + (ind.originalShare || ind.gdpShare || 0);
                    }, 0);

                        const shareToDisplay = indicator.originalShare || indicator.gdpShare;
                        const reportPeriod = CONFIG.reportPeriod;
                        const quarterMap = {
                            'S1': 'q1',

                            'S3': 'q3',
                            'S4': 'q4'

                        const currentQuarterValue = indicator[currentQuarterKey];
                        
                        let secondLineText = shareToDisplay.toFixed(2) + '%';
                        // v5.7: 始终显示目标增速（None时显示"无目标"）

                    }
                    // v4.7新增：极简渲染 - 仅显示指标名称（确保至少2字+..）
                    else if (w >= 25 && h >= 20) {

                        // 仅显示指标名称（至少2字+..）
                        const truncatedName = truncateText(indicator.indicator, w - 6, 11, 2);  // v4.7: 至少2字
                        group.append('text')
                            .attr('x', leftX)
                            .attr('y', innerY + d.y0 + 12)

                            .text(truncatedName);
                    }
                    // 否则极简渲染：仅色块
                });
            });
        }

        // 动态计算图表尺寸（v4.6：宽度占90%）
        function calculateChartSize() {
            const container = document.querySelector('.treemap-container');
            if (!container) return;
            
            // 获取容器的实际可用空间
            const containerRect = container.getBoundingClientRect();
            const availableWidth = (containerRect.width - 60) * CONFIG.chartWidthRatio;  // 90%宽度
            const availableHeight = window.innerHeight - 200;  // 减去header和其他元素
            
            // 保持22:9的宽高比（超宽屏）
            const aspectRatio = 22 / 9;
            let chartWidth = availableWidth;
            let chartHeight = chartWidth / aspectRatio;
            
            // 如果高度超出，则按高度计算宽度
            if (chartHeight > availableHeight) {
                chartHeight = availableHeight;
                chartWidth = chartHeight * aspectRatio;
            }
            
            CONFIG.width = Math.floor(chartWidth);
            CONFIG.height = Math.floor(chartHeight);
            
            console.log(`图表尺寸: ${CONFIG.width} x ${CONFIG.height} (宽度占比: ${CONFIG.chartWidthRatio * 100}%)`);
        }

        // v5.9: 自动选择最佳数据集索引
        function autoSelectDataset() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;  // 1-12
            
            let bestIndex = 0;
            let bestScore = -1;
            
            DATASETS.forEach((ds, index) => {
                let score = 0;
                
                if (ds.type === 'monthly') {
                    // 月度数据：年月匹配打分
                    if (ds.year === currentYear && ds.period <= currentMonth) {
                        score = ds.period;  // 越高越好（最新的月份）
                    }
                } else if (ds.type === 'quarterly') {
                    // 季度数据：匹配当前季度
                    const currentQuarter = Math.ceil(currentMonth / 3);
                    const dsQuarterNum = parseInt(ds.period.replace('Q', ''));
                    if (ds.year === currentYear && dsQuarterNum <= currentQuarter) {
                        score = dsQuarterNum * 3 + 100;  // 季度数据作为第二优先级
                    }
                }
                
                if (score > bestScore) {
                    bestScore = score;
                    bestIndex = index;
                }
            });
            
            console.log(`[v5.9] 自动选择数据集: ${DATASETS[bestIndex].label} (${DATASETS[bestIndex].type})`);
            return bestIndex;
        }
        
        // v5.9: 初始化数据集选择器（支持optgroup分组和智能选择）
        function initDatasetSelector() {
            const selector = document.getElementById('dataset-selector');
            
            // 清空现有选项
            selector.innerHTML = '';
            
            // 按年度分组
            const yearGroups = {};
            DATASETS.forEach((dataset) => {
                if (!yearGroups[dataset.year]) {
                    yearGroups[dataset.year] = { monthly: [], quarterly: [] };
                }
                if (dataset.type === 'monthly') {
                    yearGroups[dataset.year].monthly.push(dataset);
                } else {
                    yearGroups[dataset.year].quarterly.push(dataset);
                }
            });
            
            // 按年度降序排列
            const years = Object.keys(yearGroups).sort((a, b) => b - a);
            
            years.forEach(year => {
                const group = yearGroups[year];
                
                // v5.9: 跳过空分组（无月度也无季度数据）
                if (group.monthly.length === 0 && group.quarterly.length === 0) {
                    return;
                }
                
                const optgroup = document.createElement('optgroup');
                optgroup.label = `${year}年`;
                
                // 月度数据在前
                group.monthly.forEach(dataset => {
                    const option = document.createElement('option');
                    option.value = DATASETS.indexOf(dataset);
                    option.textContent = `${dataset.label} (月度)`;
                    optgroup.appendChild(option);
                });
                
                // 季度数据在后
                group.quarterly.forEach(dataset => {
                    const option = document.createElement('option');
                    option.value = DATASETS.indexOf(dataset);
                    option.textContent = `${dataset.label} (季度)`;
                    optgroup.appendChild(option);
                });
                
                selector.appendChild(optgroup);
            });
            
            // v5.9: 自动选择最佳数据集
            const bestIndex = autoSelectDataset();
            selector.value = bestIndex;
            
            // 绑定change事件
            selector.addEventListener('change', function() {
                const selectedIndex = parseInt(this.value);
                loadAndRenderDataset(selectedIndex);
            });
        }

        // v5.9: 加载并渲染指定数据集
        function loadAndRenderDataset(datasetIndex) {
            const dataset = DATASETS[datasetIndex];
            
            console.log(`\n[切换] 切换到数据集: ${dataset.label} (${dataset.type}) - ${dataset.file}`);
            
            // 显示loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('treemap-svg').innerHTML = '';
            
            // 加载新数据 (Demo: 从内嵌数据读取)
            Promise.resolve(JSON.parse(JSON.stringify(EMBEDDED_DATA[dataset.file])))
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    
                    console.log('=== 数据加载成功 ===');
                    console.log('数据版本:', data.meta?.version || '未知');
                    console.log('行业数量:', data.industries.length);
                    console.log('数据类型:', data.meta?.dataType || 'quarterly');
                    
                    // 更新CONFIG
                    CONFIG.reportPeriod = dataset.reportPeriod;
                    // v5.9: 记录当前数据类型
                    CONFIG.currentDataType = dataset.type;
                    
                    // v5.6: 存储当前数据并更新整体增速显示
                    window._currentData = data;
                    updateOverallGrowth(data);
                    
                    // 重新计算尺寸并渲染
                    calculateChartSize();
                    renderTreemap(data);
                    
                    // v6.0: 如果气泡图面板活跃，同步更新
                    const bubblePanel = document.getElementById('panel-bubble');
                    if (bubblePanel && bubblePanel.classList.contains('active')) {
                        window._bubbleRendered = false;
                        setTimeout(renderBubblePage, 100);
                    }
                    
                    console.log(`[OK] 数据集切换成功: ${dataset.label}\n`);
                })
                .catch(error => {
                    document.getElementById('loading').innerHTML = 
                        `<div class="error">加载数据失败: ${dataset.file}</div>`;
                    console.error('[ERROR] Error loading dataset:', error);
                });
        }

        // v5.9: 初始化数据集选择器并加载最佳数据集
        // Demo: 包裹在 try-catch 中，防止 file:// 协议下 CDN 未加载时报错

        }

        // v5.6: 计算整体增速（按GDP占比加权平均）并更新显示
        function computeOverallGrowth(data) {
            let totalWeight = 0;
            let weightedSum = 0;
            const quarterMap = { 'S1': 'q1', 'S2': 'q2', 'S3': 'q3', 'S4': 'q4' };
            const currentQuarterKey = quarterMap[CONFIG.reportPeriod] || 'q1';
            
            data.industries.forEach(industry => {
                industry.indicators.forEach(ind => {
                    if (ind[currentQuarterKey] !== null && ind[currentQuarterKey] !== undefined) {
                        const weight = ind.originalShare || ind.gdpShare || 0;
                        weightedSum += ind[currentQuarterKey] * weight;
                        totalWeight += weight;
                    }
                });
            });
            
            return totalWeight > 0 ? (weightedSum / totalWeight) : null;
        }

        // v5.6: 更新整体增速显示
        function updateOverallGrowth(data) {
            const overallGrowth = computeOverallGrowth(data);
            const growthEl = document.getElementById('overall-growth');
            if (overallGrowth !== null) {
                growthEl.textContent = overallGrowth.toFixed(1);

        // v5.6: 可编辑数值交互
        function initEditableValues() {
            const editableEls = document.querySelectorAll('.editable-value');
            
            editableEls.forEach(el => {
                el.addEventListener('click', function() {
                    if (this.querySelector('input')) return; // 已在编辑态
                    
                    const currentValue = this.textContent.trim();
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'editable-input';
                    input.value = currentValue === '--' ? '' : currentValue;
                    
                    // 保存原始值用于取消
                    const originalValue = currentValue;
                    
                    this.textContent = '';
                    this.appendChild(input);
                    input.focus();
                    input.select();
                    
                    const commitEdit = () => {
                        let val = input.value.trim();
                        // 校验：允许空、数字、最多1位小数
                        if (val !== '' && val !== '--') {
                            const num = parseFloat(val);
                            if (!isNaN(num)) {
                                val = num.toFixed(1);
                            } else {
                                val = originalValue; // 非法输入恢复原值
                            }
                        } else {
                            val = '--';
                        }
                        this.textContent = val;
                    };
                    
                    input.addEventListener('blur', commitEdit);
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            input.blur();
                        } else if (e.key === 'Escape') {
                            input.value = originalValue;
                            input.blur();
                        }
                    });
                });
            });
        }

        initEditableValues();

        // 从已加载数据中提取所有指标为扁平数组
        function processBubbleData(data) {
            const items = [];
            if (!data || !data.industries) return items;
            data.industries.forEach(ind => {
                (ind.indicators || []).forEach(indic => {
                    // Y轴：取最新有效季度增速 (q2 > q1)
                    const yVal = indic.q2 !== null && indic.q2 !== undefined ? indic.q2
                               : indic.q1 !== null && indic.q1 !== undefined ? indic.q1 : null;
                    if (yVal === null) return; // 无任何增速数据，跳过
                    items.push({
                        industry: indic.industry,
                        indicator: indic.indicator,
                        gdpShare: indic.gdpShare || 0,
                        targetGap: indic.targetGap,
                        currentTarget: indic.currentTarget,
                        q1: indic.q1,
                        q2: indic.q2,
                        yValue: yVal,
                        monthlyValues: indic.monthlyValues || [],
                        monthlyDates: indic.monthlyDates || [],
                        remark: indic.remark || '',
                        reportPeriod: indic.reportPeriod || data.meta?.reportPeriod || 'S2'
                    });
                });
            });
            return items;
        }

        // 气泡颜色（四级 + 无目标灰）
        function getBubbleColor(item) {
            if (item.targetGap === null || item.targetGap === undefined) {
                return { fill: 'rgba(140,140,140,0.5)', stroke: 'rgba(160,160,160,0.6)', label: '无目标' };
            }
            if (item.targetGap <= -30) {
                return { fill: 'rgba(210,80,70,0.65)', stroke: 'rgba(230,100,85,0.8)', label: '差距≥30%' };
            }
            if (item.targetGap <= -15) {
                return { fill: 'rgba(220,170,40,0.65)', stroke: 'rgba(240,190,55,0.8)', label: '差距15%-30%' };
            }
            if (item.targetGap < 0) {
                return { fill: 'rgba(70,110,170,0.65)', stroke: 'rgba(90,140,200,0.8)', label: '差距<15%' };
            }
            return { fill: 'rgba(70,155,95,0.65)', stroke: 'rgba(90,180,120,0.8)', label: '达标' };
        }

        // 气泡半径：targetGap绝对值 → 半径 5~28
        function getBubbleRadius(item) {
            if (item.targetGap === null || item.targetGap === undefined) return 5;
            const absGap = Math.abs(item.targetGap);
            if (absGap <= 1) return 6;
            if (absGap <= 5) return 10;
            if (absGap <= 15) return 16;
            if (absGap <= 30) return 22;
            return 28;
        }

        // 整体GDP增速（加权平均）
        function calcOverallGrowth(data) {
            if (!data || !data.industries) return null;
            let totalWeight = 0, weightedSum = 0;
            data.industries.forEach(ind => {
                (ind.indicators || []).forEach(indic => {
                    const v = indic.q2 !== null && indic.q2 !== undefined ? indic.q2
                            : indic.q1 !== null && indic.q1 !== undefined ? indic.q1 : null;
                    if (v !== null && indic.gdpShare) {
                        weightedSum += v * indic.gdpShare;
                        totalWeight += indic.gdpShare;
                    }
                });
            });
            return totalWeight > 0 ? weightedSum / totalWeight : null;
        }

        // v6.6: 霓虹"内光外晕"趋势曲线——"先抑后扬"形 + 三层叠加 + 深海探测蓝
        function generateTrendCurveSVG(changeValue, seed) {
            const trendUp = changeValue !== null ? changeValue >= 0 : false;
            const w = 130, h = 42;                           // 加高：辉光 + 底部"未来趋势"标签
            const midY = 16;                                  // 视觉中线（上方曲线，下方标签）
            const ec = trendUp ? '#4ECB71' : '#FF6B6B';       // 终点颜色：涨↑绿 / 跌↓红

            // 确定性伪随机（按指标名 hash）
            let s = seed;
            const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };

            // "先抑后扬，末端翘起" 参数化路径（20个采样点，高精度）
            const n = 20;
            const pts = [];
            const direction = trendUp ? 1 : -1;
            const endDelta = 7;                                // 端点偏移幅度

            for (let i = 0; i < n; i++) {
                const prg = i / (n - 1);
                const x = 4 + prg * (w - 10);                 // x: 4→120

                // "先抑"：0-55% 柔和下坠弧度（高斯钟形），峰值在进度 32%
                const downArc = direction * 12 * Math.exp(-Math.pow((prg - 0.32) / 0.22, 2));

                // "后扬"：55-100% S型回升（sigmoid），转折点在进度 65%
                const rec = endDelta / (1 + Math.exp(-(prg - 0.65) * 14));
                const recovery = direction > 0 ? rec : -rec;

                // 微扰动（±2px），两端更小，保留自然感
                const wobble = (rnd() - 0.5) * 2.5 * (1 - Math.abs(prg - 0.5) * 1.5);

                pts.push({ x: x, y: midY + downArc - recovery + wobble });
            }

            // Catmull-Rom → Bezier 样条插值（C1 连续）
            function catmullRomTangent(i, tension) {
                if (i === 0) return { x: (pts[1].x - pts[0].x) * tension, y: (pts[1].y - pts[0].y) * tension };
                if (i === n - 1) return { x: (pts[n-1].x - pts[n-2].x) * tension, y: (pts[n-1].y - pts[n-2].y) * tension };
                return {
                    x: (pts[i+1].x - pts[i-1].x) * tension * 0.5,
                    y: (pts[i+1].y - pts[i-1].y) * tension * 0.5
                };
            }

            const tension = 0.5;
            let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
            for (let i = 0; i < n - 1; i++) {
                const t0 = catmullRomTangent(i, tension);
                const t1 = catmullRomTangent(i + 1, tension);
                const cp1x = pts[i].x + t0.x / 3;
                const cp1y = pts[i].y + t0.y / 3;
                const cp2x = pts[i+1].x - t1.x / 3;
                const cp2y = pts[i+1].y - t1.y / 3;
                d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${pts[i+1].x.toFixed(1)} ${pts[i+1].y.toFixed(1)}`;
            }

            const gid = `glow_${seed}`;

            return `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="${gid}" x="-25%" y="-25%" width="150%" height="150%">
                        <feGaussianBlur stdDeviation="6"/>
                    </filter>
                </defs>
                <!-- 底层：环境辉光（blur 6px，大面积氛围） -->
                <path d="${d}" fill="none" stroke="rgba(10,110,156,0.20)" stroke-width="12"
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#${gid})" vector-effect="non-scaling-stroke"/>
                <!-- 中层：核心光柱（深海钴蓝 #0A6E9C，粗壮体积感） -->
                <path d="${d}" fill="none" stroke="#0A6E9C" stroke-width="4"
                      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
                <!-- 顶层：高光脊线（冷蓝白 #5BA9D9，浮于中线之上） -->
                <path d="${d}" fill="none" stroke="#5BA9D9" stroke-width="1.3" opacity="0.90"
                      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
                <!-- 起点标记 -->
                <circle cx="${pts[0].x.toFixed(1)}" cy="${pts[0].y.toFixed(1)}" r="2.2" fill="#0A6E9C" opacity="0.65" vector-effect="non-scaling-stroke"/>
                <!-- 终点标记（涨↑绿 / 跌↓红，高亮强调方向） -->
                <circle cx="${pts[n-1].x.toFixed(1)}" cy="${pts[n-1].y.toFixed(1)}" r="2.8" fill="${ec}" opacity="0.90" vector-effect="non-scaling-stroke"/>
                <!-- 底部标注 -->
                <text x="${w/2}" y="${h-7}" text-anchor="middle" font-size="11" font-family="'Microsoft YaHei','PingFang SC',sans-serif"
                      fill="#e0f0ff" font-weight="400" letter-spacing="1.5" opacity="0.65">未来趋势</text>
            </svg>`;
        }

        // ③ 目标差距TOP6卡片
        function renderTop6Cards(data) {
            const grid = document.getElementById('top6-grid');
            if (!grid || !data) return;
            const items = processBubbleData(data);
            // 按targetGap绝对值降序（null排末尾），取前6
            const sorted = items.slice().sort((a, b) => {
                const ga = a.targetGap !== null && a.targetGap !== undefined ? Math.abs(a.targetGap) : -1;
                const gb = b.targetGap !== null && b.targetGap !== undefined ? Math.abs(b.targetGap) : -1;
                return gb - ga;
            });
            const top6 = sorted.slice(0, 6);

            grid.innerHTML = top6.map((d, i) => {
                const nameShort = d.indicator.length > 16 ? d.indicator.substring(0, 16) + '…' : d.indicator;
                const share = d.gdpShare ? d.gdpShare.toFixed(2) : '?';
                const q1v = d.q1 !== null ? d.q1.toFixed(1) + '%' : '—';
                const q2v = d.q2 !== null ? d.q2.toFixed(1) + '%' : '—';
                const change = (d.q1 !== null && d.q2 !== null) ? (d.q2 - d.q1) : null;
                const arrow = change !== null ? (change >= 0 ? 'up' : 'down') : '';
                const arrowIcon = change !== null ? (change >= 0 ? '▲' : '▼') : '';
                const changeStr = change !== null ? Math.abs(change).toFixed(1) + '%' : '';
                const gap = d.targetGap !== null && d.targetGap !== undefined ? d.targetGap.toFixed(1) + '%' : '无目标';
                const rankColors = ['#ff6b6b', '#ff8c52', '#ffa040', '#ffb850', '#ffcc60', '#ffe070'];
                // v6.6: 趋势曲线种子（指标名 hash）
                const curveSeed = d.indicator.split('').reduce((a, c) => ((a << 5) - a + c.charCodeAt(0)) | 0, 0) >>> 0;
                const trendSVG = generateTrendCurveSVG(change, curveSeed);
                return `
                <div class="top6-card">
                    <div class="card-info">
                        <div class="card-rank" style="color:${rankColors[i]}">TOP ${i + 1}</div>
                        <div class="card-name">${nameShort} (${share}%)</div>
                        <div class="card-q-row">Q1: ${q1v} <span class="card-q-arrow ${arrow}">${arrowIcon}</span> Q2: ${q2v} <span style="color:rgba(180,200,220,0.6)">${changeStr}</span></div>
                        <div class="card-gap">目标差距：${gap}</div>
                    </div>
                    <div class="card-trend-curve">${trendSVG}</div>
                </div>
                `;
            }).join('');
        }

            ];
            list.innerHTML = tasks.map(t =>
                `<li class="task-item"><span class="task-indicator">${t.indicator}</span><span class="task-desc">→ ${t.desc}</span></li>`
            ).join('');
        }

        // 主渲染函数（气泡图页面入口）
        function renderBubblePage() {
            const data = window._currentData;
            if (!data) { console.log('[气泡图] 暂无数据，跳过渲染'); return; }
            console.log('[气泡图] 开始渲染，指标总数:', processBubbleData(data).length);

            // v6.1: ECharts 实例在 renderBubbleChart 内部自动 dispose+init

            renderKPICards(data);
            renderBubbleChart(data);
            renderTop6Cards(data);
            renderQ2Tasks();
        }

        // 气泡图窗口 resize 重绘
        let _bubbleResizeTimer = null;
        window.addEventListener('resize', function() {
            clearTimeout(_bubbleResizeTimer);
            _bubbleResizeTimer = setTimeout(function() {
                const bubblePanel = document.getElementById('panel-bubble');
                if (bubblePanel && bubblePanel.classList.contains('active') && window._bubbleChart) {
                    window._bubbleChart.resize();
                }
            }, 300);
        });

        // Demo: 登出功能已移除 (演示版无需登录)

        // v5.9.10: TAB切换逻辑
        (function initTabSwitching() {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabPanels = document.querySelectorAll('.tab-panel');
            const headerTitle = document.querySelector('.header h1');
            const pageName = document.getElementById('page-name');

            // 从当前标题提取版本号
            const versionMatch = headerTitle.textContent.match(/v(\d+\.\d+)/);
            const version = versionMatch ? 'v' + versionMatch[1] : 'v6.1';

            const tabTitles = {
                'matrix': 'GDP核心指标矩阵图 ' + version + ' - 科技蓝统一配色版',
                'bubble': 'GDP核心指标气泡图 ' + version + ' - 科技蓝统一配色版'
            };

            const pageTitles = {
                'matrix': 'GDP核心指标矩阵 ' + version,
                'bubble': 'GDP核心指标气泡 ' + version
            };

            const docTitles = {
                'matrix': 'GDP核心指标矩阵图 ' + version + ' - 月度增速趋势',
                'bubble': 'GDP核心指标气泡图 ' + version + ' - 月度增速趋势'
            };

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabName = this.dataset.tab;

                    // 更新按钮状态
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    // 切换面板
                    tabPanels.forEach(p => p.classList.remove('active'));
                    document.getElementById('panel-' + tabName).classList.add('active');

                    // 更新标题
                    headerTitle.textContent = tabTitles[tabName];
                    document.title = docTitles[tabName];
                    if (pageName) pageName.textContent = pageTitles[tabName];

                    // 切换到矩阵图时重新计算图表尺寸
                    if (tabName === 'matrix') {
                        setTimeout(function() {
                            calculateChartSize();
                            const svg = d3.select('#treemap-svg');
                            svg.attr('viewBox', '0 0 ' + CONFIG.width + ' ' + CONFIG.height);
                        }, 100);
                    }
                    // v6.0: 切换到气泡图时渲染气泡图页面
                    if (tabName === 'bubble') {
                        setTimeout(function() {
                            renderBubblePage();
                        }, 150);
                    }
                });
            });
        })();
    </script>

    <div class="page-name" id="page-name">GDP核心指标矩阵 v6.6</div>
</body>
</html>
