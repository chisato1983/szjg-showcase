  /* ===== 鲜活视效包（纯装饰，不增原型内容） ===== */

  main>*{position:relative;z-index:1;animation:panelIn .7s cubic-bezier(.22,1,.36,1) both}

  main>*:nth-child(2){animation-delay:.18s}

function renderList() {
  var arr = risks.filter(function(r) { return filter === '全部' || r.status === filter; });
  // 排序：处置中在前，已完成在后
  arr.sort(function(a, b) {
    if (a.status === '处置中' && b.status !== '处置中') return -1;
    if (a.status !== '处置中' && b.status === '处置中') return 1;
    return 0;
  });
  $('#riskCount').textContent = (filter === '全部' ? '全部' : filter) + ' ' + arr.length;
  $('#pageInfo').textContent = '共 ' + arr.length + ' 条';
  $('#prevPage').style.display = 'none';
  $('#nextPage').style.display = 'none';
  $('#riskList').innerHTML = arr.map(function(r, idx) {
    return '<div class="risk-row risk-row-enter ' + (r.id === selected.id ? 'selected' : '') + ' grid grid-cols-[1fr_74px_48px] gap-1 px-2.5 py-3.5 border-b border-sky-400/10 cursor-pointer" data-id="' + r.id + '" style="--i:' + idx + '">' +

    '<span class="text-[11px] ' + (r.status === '已完成' ? 'text-emerald-300' : 'text-amber-300') + '">' + r.status + '</span>' +
    '</div>';
  }).join('');
  document.querySelectorAll('.risk-row').forEach(x => x.onclick = function() {
    selectRisk(risks.find(r => r.id === x.dataset.id));
  });
}

// ========== 标记 ==========
// 自定义点样式（与 .marker-dot 视觉一致），用于 AMap 原生标记的 content
function markerHTML(r) {
  var sel = selected && r.id === selected.id;
  var color = r.status === '已完成' ? '#30e6a0' : '#ffbb45';
  var glow = r.status === '已完成' ? '#20d98f' : '#ff9d27';
  return '<div style="width:15px;height:15px;border-radius:50%;border:3px solid #d7f6ff;' +
    'background:' + color + ';box-shadow:0 0 0 5px rgba(255,177,59,.2),0 0 18px ' + glow + ';' +
    'transform:scale(' + (sel ? 1.35 : 0.72) + ');transition:transform .2s ease;' +
    (r.status === '处置中' ? 'animation:pulse 1.8s infinite;' : '') + '"></div>';
}
// 统一选中逻辑（列表点击仅切换 class+脉冲，避免重播入场动画）
function selectRisk(r) {
  selected = r;
  var found = false;
  document.querySelectorAll('.risk-row').forEach(function(row) {
    row.classList.remove('selected', 'risk-pulse');
    if (row.dataset.id === r.id) {
      row.classList.add('selected');
      void row.offsetWidth;
      row.classList.add('risk-pulse');
      found = true;
    }
  });
  if (!found) renderList(); // 地图标记点击等行不在列表中的情况
  renderDetail(); renderMarkers(); showPopup(r);
}
// 主入口：AMap 已加载 -> 更新原生标记内容；否则降级为 CSS 叠层
function renderMarkers() {
  if (mapLoaded && map) {
    risks.forEach(function(r) {
      var mk = mapMarkers[r.id];
      if (mk) mk.setContent(markerHTML(r));
    });
    return;
  }
  // 降级：CSS 百分比叠层
  $('#markers').innerHTML = risks.map(function(r) {
    var cls = 'marker ' + (r.status === '已完成' ? 'done' : 'processing') + (r.id === selected.id ? ' selected' : '');
    return '<div class="' + cls + '" style="left:' + r.x + '%;top:' + r.y + '%" data-id="' + r.id + '" aria-label="Risk event marker"><div class="marker-dot"></div></div>';
  }).join('');
  document.querySelectorAll('#markers .marker').forEach(function(m) {
    m.onclick = function(e) {
      e.stopPropagation();
      selectRisk(risks.find(function(r) { return r.id === m.dataset.id; }));
    };
  });
}

// ========== 弹窗 ==========
function positionPopup(r) {
  var p = $('#eventPopup');
  if (mapLoaded && map) {
    var px = map.lngLatToContainer(new AMap.LngLat(r.lng, r.lat));
    var w = p.offsetWidth || 245, h = p.offsetHeight || 160;
    var size = map.getSize();
    var left = Math.max(8, Math.min(px.x - w / 2, size.width - w - 8));
    var top = Math.max(8, px.y - h - 18);
    p.style.left = left + 'px';
    p.style.top = top + 'px';
  } else {
    p.style.left = Math.min(Math.max(r.x - 10, 4), 72) + '%';
    p.style.top = Math.min(Math.max(r.y - 26, 8), 58) + '%';
  }
}
function repositionPopup() {
  var p = $('#eventPopup');
  if (!p.classList.contains('hidden') && selected) positionPopup(selected);
}
function showPopup(r) {
  var p = $('#eventPopup');
  p.classList.remove('hidden');
  positionPopup(r);
  $('#popTitle').textContent = r.title;
  $('#popLevel').textContent = r.level;
  $('#popAdvice').textContent = r.status === '已完成' ? '风险已完成闭环处置，现场复核通过。' : '此次风险较为重大，正在联系相关部门进行处理。';
  $('#dispatchBtn').onclick = function() { $('#dispatchConfirm').classList.remove('hidden'); };
}

// ========== 高德地图 + Fallback ==========
var mapLoaded = false;
var mapFallbackTimer = null;
var map = null;
var mapMarkers = {};

function initMap() {
  if (!window.AMap) {
    if (!mapFallbackTimer) mapFallbackTimer = setTimeout(showMapFallback, 8000);
    return setTimeout(initMap, 500);
  }
  clearTimeout(mapFallbackTimer);
  mapLoaded = true;
  map = new AMap.Map('amapCanvas', {
    zoom: 14,
    center: [106.575, 29.558],
    mapStyle: 'amap://styles/dark',
    viewMode: '3D',
    pitch: 45,
    showLabel: true,
    showBuildingBlock: true
  });
  // 清空 CSS 降级叠层，避免与原生标记重复
  $('#markers').innerHTML = '';
  risks.forEach(function(r) {
    var marker = new AMap.Marker({
      position: new AMap.LngLat(r.lng, r.lat),
      title: r.title,
      content: markerHTML(r),
      offset: new AMap.Pixel(-7.5, -7.5)
    });
    marker.setMap(map);
    marker.on('click', function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      selectRisk(r);
    });
    mapMarkers[r.id] = marker;
  });
  map.on('mapmove', repositionPopup);
  map.on('zoomchange', repositionPopup);
}

function showMapFallback() {
  mapLoaded = false;
  renderMarkers();
  var toast = document.createElement('div');
  toast.className = 'absolute top-10 left-1/2 -translate-x-1/2 z-20 px-4 py-2 rounded-lg bg-amber-500/20 border border-amber-300/40 text-xs text-amber-200';
  toast.textContent = '地图服务暂不可用，已降级为静态视图';
  toast.id = 'mapFallbackToast';
  document.getElementById('map').appendChild(toast);
  setTimeout(function() { var t = document.getElementById('mapFallbackToast'); if (t) t.remove(); }, 5000);
}

// ========== 值班详情 ==========
var dutyPages = {};
function dutyPeople(level) {
  return level === '三支力量' ? dutyData[level].网格.concat(dutyData[level].下沉, dutyData[level].基干) : dutyData[level];
}
function updateDutyCounts() {
  document.querySelectorAll('.duty-count').forEach(function(x) {
    var data = dutyPeople(x.dataset.count) || [];
    x.textContent = data.length + '人';
  });
}

function dutyTable(title, rows, key) {
  var current = dutyPages[key] || 1;
  var size = rows.length > 12 ? 'text-[9px]' : 'text-[10px]';
  var pages = Math.ceil(rows.length / 8) || 1;
  current = Math.min(current, pages);
  dutyPages[key] = current;
  var showContact = key === '三支力量' || key === '网格' || key === '下沉' || key === '基干';
  var colspan = showContact ? 3 : 2;
  return '<div class="rounded-lg border border-sky-300/15 bg-sky-950/50 p-3 overflow-hidden">' +

    (showContact ? '<th class="w-[33%] py-1">联系电话</th>' : '') + '</tr></thead><tbody>' +
    (rows.length ? rows.slice((current - 1) * 8, current * 8).map(function(x) {

        (showContact ? '<td class="py-1.5 text-sky-200/70 break-words">' + (x[2] || '') + '</td>' : '') + '</tr>';
    }).join('') : '<tr class="border-t border-sky-300/10"><td colspan="' + colspan + '" class="py-3 text-center text-sky-300/65">暂无数据</td></tr>') +
    '</tbody></table>' +

    Array.from({length: pages}, function(_, i) {
      return '<button class="duty-page w-6 h-5 rounded ' + (i + 1 === current ? 'bg-cyan-500 text-white' : 'bg-sky-900 text-sky-200') + '" data-duty-key="' + key + '" data-page="' + (i + 1) + '">' + (i + 1) + '</button>';

function renderDutyPage(level) {
  if (level === '三支力量') {
    $('#detailBody').innerHTML = '<div class="space-y-3">' +
      dutyTable('基层网格力量', dutyData[level].网格, '网格') +
      dutyTable('镇街下沉力量', dutyData[level].下沉, '下沉') +
      dutyTable('基干力量', dutyData[level].基干, '基干') + '</div>';
  } else {
    $('#detailBody').innerHTML = '<div class="space-y-3">' + dutyTable(level, dutyData[level], level) + '</div>';
  }
  document.querySelectorAll('.duty-prev,.duty-next,.duty-page').forEach(function(b) {
    b.onclick = function() {
      var key = b.dataset.dutyKey;
      var rows = level === '三支力量' ? dutyData[level][key] : dutyData[level];
      var pages = Math.ceil(rows.length / 8) || 1;
      var current = dutyPages[key] || 1;
      if (b.classList.contains('duty-prev')) current = Math.max(1, current - 1);
      else if (b.classList.contains('duty-next')) current = Math.min(pages, current + 1);
      else current = Number(b.dataset.page);
      dutyPages[key] = current;
      renderDutyPage(level);
    };
  });
}

  dutyPages = {};

// 打开排查报告 lightbox
var galleryItems = [], galleryIdx = 0, carouselTimer = null;

function initCarousel() {
  stopCarousel();
  updateCarousel();
  var dots = document.getElementById('carouselDots');
  if (dots) {
    dots.innerHTML = galleryItems.map(function(_, i) {
      return '<span class="inline-block w-1.5 h-1.5 rounded-full ' + (i === 0 ? 'bg-cyan-300 scale-125' : 'bg-white/35') + ' cursor-pointer transition-all" onclick="goSlide(' + i + ')"></span>';
    }).join('');
  }
  var prev = document.getElementById('carouselPrev'), next = document.getElementById('carouselNext');
  if (prev) prev.onclick = prevSlide;
  if (next) next.onclick = nextSlide;
  startCarousel();
}

function updateCarousel() {
  var img = document.getElementById('carouselImg');
  if (img) img.src = galleryItems[galleryIdx];
  var dots = document.getElementById('carouselDots');
  if (dots) {
    [].forEach.call(dots.children, function(d, i) {
      d.className = 'inline-block w-1.5 h-1.5 rounded-full ' + (i === galleryIdx ? 'bg-cyan-300 scale-125' : 'bg-white/35') + ' cursor-pointer transition-all';
    });

function nextSlide() { galleryIdx = (galleryIdx + 1) % galleryItems.length; updateCarousel(); }
function prevSlide() { galleryIdx = (galleryIdx - 1 + galleryItems.length) % galleryItems.length; updateCarousel(); }
function goSlide(idx) { galleryIdx = idx; updateCarousel(); startCarousel(); }

function startCarousel() { stopCarousel(); if (galleryItems.length > 1) carouselTimer = setInterval(nextSlide, 3500); }
function stopCarousel() { if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; } }

function openGallery(idx) {
  galleryIdx = idx; stopCarousel();

function updateLightbox() {
  if (galleryItems.length === 0) return;
  $('#photoLightbox img').src = galleryItems[galleryIdx] || galleryItems[0];
  var cnt = document.getElementById('lbCounter');
  if (cnt) cnt.textContent = galleryItems.length > 1 ? (galleryIdx + 1) + ' / ' + galleryItems.length : '';
  var p = document.getElementById('lbPrev'), n = document.getElementById('lbNext');
  if (p) { p.style.display = galleryItems.length > 1 ? 'flex' : 'none'; }
  if (n) { n.style.display = galleryItems.length > 1 ? 'flex' : 'none'; }

function lightboxNext() { galleryIdx = (galleryIdx + 1) % galleryItems.length; updateLightbox(); }
function lightboxPrev() { galleryIdx = (galleryIdx - 1 + galleryItems.length) % galleryItems.length; updateLightbox(); }

// 值班数字 count-up + 流程连线进度点亮
function countUp() {
  document.querySelectorAll('.duty-count').forEach(function(el) {
    var target = parseInt(el.textContent, 10) || 0;
    if (target === 0) { el.textContent = '0人'; return; }
    var dur = 900, start = null;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(eased * target) + '人';
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function updateFlowProgress() {
  var order = ['发现', '推送', '反馈'];
  var activeIdx = order.indexOf(node);
  document.querySelectorAll('.flow-line').forEach(function(line, i) {
    if (activeIdx > i) line.classList.add('lit'); else line.classList.remove('lit');
  });
}

// 实时时钟
function updateClock() {
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  var h = String(now.getHours()).padStart(2, '0');
  var mi = String(now.getMinutes()).padStart(2, '0');
  var s = String(now.getSeconds()).padStart(2, '0');
  var weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  document.getElementById('clockDate').textContent = y + '-' + m + '-' + d;
  document.getElementById('clockTime').textContent = h + ':' + mi + ':' + s + '  ' + weekdays[now.getDay()];
}
updateClock();
setInterval(updateClock, 1000);

// ========== 启动 ==========
renderList();
renderDetail();
renderMarkers();

updateFlowProgress();
setTimeout(countUp, 650);
// 加载遮罩：初始化完成后立即隐藏，同时兜底 load 事件
function hideLoading() {
  var overlay = document.getElementById('loadingOverlay');
  if (overlay) { overlay.style.opacity = '0'; overlay.style.transition = 'opacity .4s'; setTimeout(function() { overlay.remove(); }, 400); }
}
// 方案1：初始化渲染完成后立即隐藏（不依赖外部资源加载）
setTimeout(hideLoading, 300);
// 方案2：兜底——window.load 触发时也尝试隐藏
window.addEventListener('load', function() { hideLoading(); });
