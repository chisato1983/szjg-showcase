<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访问验证</title>
<style>
  :root {
    --bg: #0b0b10;
    --card-bg: #111118;
    --border: #1e1e2a;
    --text: #e8e8ed;
    --text-secondary: #7c7c8a;
    --accent: #5e6ad2;
    --radius: 4px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 36px;
    width: 360px;
    max-width: 90vw;
  }
  .card h1 { font-size: 1.125rem; font-weight: 700; margin-bottom: 6px; }
  .card p { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 12px; font-size: 1rem;
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    outline: none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 10px 0; font-size: 0.9375rem; font-weight: 600;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { font-size: 0.8125rem; color: #ef4444; margin-top: 12px; display: none; }
  .error.show { display: block; }
  .footer { margin-top: 20px; font-size: 0.75rem; color: var(--text-secondary); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>需要访问密码</h1>
  <p>请输入密码以继续访问此页面</p>
  <div class="field">
    <label for="pwd">密码</label>
    <input type="password" id="pwd" placeholder="请输入访问密码" autofocus autocomplete="off">
  </div>
  <button class="btn" id="btn">确 认</button>
  <div class="error" id="error"></div>
  <div class="footer">加密连接 · 访问受保护</div>
</div>
<script>
  const pwd = document.getElementById('pwd');
  const btn = document.getElementById('btn');
  const error = document.getElementById('error');

  pwd.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
  btn.addEventListener('click', submit);

  function submit() {
    const val = pwd.value.trim();
    if (!val) return;
    btn.disabled = true;
    btn.textContent = '验证中...';
    error.classList.remove('show');
    fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: val })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
    .then(({ ok, data }) => {
      if (ok && data.success) {
        const redirect = new URLSearchParams(location.search).get('redirect') || '/';
        location.href = redirect;
      } else {
        btn.disabled = false;
        btn.textContent = '确 认';
        error.textContent = data.message || '密码错误';
        error.classList.add('show');
        pwd.value = '';
        pwd.focus();
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = '确 认';
      error.textContent = '网络错误，请重试';
      error.classList.add('show');
    });
  }
</script>
</body>
</html>
